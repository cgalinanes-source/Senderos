<title>Senderos Argentinos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. Carta topográfica a la derecha, cuaderno de campo a la izquierda (abajo en el teléfono). */
:root{
  --paper:#e9ede8; --land:#f7f8f2; --land-edge:#9aa79a; --neigh:#dde2dc; --sea:#d3dfe3;
  --ink:#1f2b2e; --ink-2:#56635f; --ink-3:#8a9590; --line:#c9d1cb; --panel:#fbfcf9; --panel-2:#f1f4ef;
  --accent:#c9481b; --accent-ink:#fff; --accent-soft:#f6ded3;
  --d1:#2f8a4e; --d2:#c08a12; --d3:#d0541e; --d4:#5b3e8f;
  --ok:#2f8a4e; --shadow:0 1px 2px rgba(31,43,46,.08),0 6px 20px rgba(31,43,46,.08);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141b1d; --land:#222c2e; --land-edge:#4f5e5c; --neigh:#1a2224; --sea:#0f1618;
  --ink:#e6ece7; --ink-2:#aab6b0; --ink-3:#77847f; --line:#344143; --panel:#192123; --panel-2:#212b2d;
  --accent:#ef6a3a; --accent-ink:#1a0d07; --accent-soft:#3b2219;
  --d1:#4fbf75; --d2:#e0ab33; --d3:#f07a45; --d4:#a487dc; --ok:#4fbf75; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141b1d; --land:#222c2e; --land-edge:#4f5e5c; --neigh:#1a2224; --sea:#0f1618;
  --ink:#e6ece7; --ink-2:#aab6b0; --ink-3:#77847f; --line:#344143; --panel:#192123; --panel-2:#212b2d;
  --accent:#ef6a3a; --accent-ink:#1a0d07; --accent-soft:#3b2219;
  --d1:#4fbf75; --d2:#e0ab33; --d3:#f07a45; --d4:#a487dc; --ok:#4fbf75; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:380px 1fr;grid-template-rows:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;z-index:2}
.brand{display:flex;align-items:center;gap:12px;padding-block:16px 12px;padding-inline:20px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
.brand .mark{width:34px;height:34px;flex:none}
.brand small{display:block;font-family:var(--f-data);font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-top:3px;text-transform:none}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;background:var(--panel-2);font-size:13px;max-width:150px;cursor:pointer}
.who img{width:26px;height:26px;border-radius:50%;flex:none}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;padding-inline:12px;border-bottom:1px solid var(--line)}
.tab{white-space:nowrap;flex:1;background:none;border:0;padding:10px 4px 9px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-data);font-size:11px;font-weight:500;letter-spacing:0;margin-left:3px;color:var(--ink-3)}
.pane{flex:1;overflow:auto;min-height:0;padding-block:14px 24px;padding-inline:20px;display:flex;flex-direction:column;gap:14px}
.banner{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.filters{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:4px;min-width:62px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.count{font-size:12.5px;color:var(--ink-3)}
.list{display:flex;flex-direction:column;gap:2px;margin-inline:-8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 8px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.item:hover,.item.hl{background:var(--panel-2)}
.item .t{font-weight:600;font-size:14px;line-height:1.25}
.item .s{font-size:12px;color:var(--ink-3);margin-top:1px}
.item .m{font-family:var(--f-data);font-size:11.5px;color:var(--ink-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.st{font-family:var(--f-data);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.st.done{background:var(--ok);color:var(--panel)}
.st.saved{border:1px solid var(--accent);color:var(--accent)}
.diff{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:14px;flex:none}
.diff.d1{background:var(--d1)}.diff.d2{background:var(--d2)}.diff.d3{background:var(--d3)}.diff.d4{background:var(--d4)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--ink-2);font-size:13.5px;text-align:center}
/* detail */
.back svg{width:16px;height:16px}
[hidden]{display:none!important}
.back{align-self:flex-start;background:none;border:0;color:var(--ink-2);cursor:pointer;padding:2px 0;font-size:13px;display:flex;gap:4px;align-items:center}
.dh{display:flex;flex-direction:column;gap:4px}
.dh .eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.dh h2{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.005em}
.dh .area{color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px 3px 4px;color:#fff;align-self:flex-start}
.badge .diff{width:20px;height:20px;font-size:12px;border-radius:50%;background:rgba(255,255,255,.22)}
.badge.d1{background:var(--d1)}.badge.d2{background:var(--d2)}.badge.d3{background:var(--d3)}.badge.d4{background:var(--d4)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{padding:10px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.profile{display:flex;align-items:flex-end;gap:2px;height:54px;padding:0 2px}
.desc{font-size:14.5px;line-height:1.55;max-width:62ch;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.note{font-size:12.5px;color:var(--ink-2);border-left:3px solid var(--d2);padding:6px 10px;background:var(--panel-2);border-radius:0 6px 6px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.done-on{border-color:var(--ok);color:var(--panel);background:var(--ok)}
.btn svg{width:16px;height:16px}
.form{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel-2)}
.form label{font-size:12px;color:var(--ink-2);display:grid;gap:4px}
.form input,.form textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.link{color:var(--accent);font-weight:600;text-decoration:none;font-size:13.5px}
.link:hover{text-decoration:underline}
.fine{font-size:11.5px;color:var(--ink-3);line-height:1.45}
/* profile */
.me{display:flex;gap:14px;align-items:center}
.me img{width:52px;height:52px;border-radius:50%}
.me h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1;text-transform:uppercase}
.lvl{font-family:var(--f-data);font-size:11.5px;color:var(--ink-2);margin-top:4px}
.bar{height:8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--ink-3)}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 0;color:var(--ink-2)}
.provs{display:flex;flex-wrap:wrap;gap:4px}
.prov{font-size:11.5px;border-radius:4px;padding:2px 7px;border:1px solid var(--line);color:var(--ink-3)}
.prov.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* challenges */
.ch{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ch:last-child{border-bottom:0}
.medal{width:44px;height:44px}
.ch .t{font-weight:600}
.ch .s{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.ch .p{font-family:var(--f-data);font-size:11px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.rk{display:grid;grid-template-columns:22px 30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rk img{width:30px;height:30px;border-radius:50%}
.rk .pos{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink-3)}
.rk .xp{font-family:var(--f-data);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.rk.me-row .nm{font-weight:700}
/* map */
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--sea);overflow:hidden;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.ar{fill:var(--land);stroke:var(--land-edge);stroke-width:1;vector-effect:non-scaling-stroke}
.ne{fill:var(--neigh);stroke:var(--land-edge);stroke-width:.6;stroke-opacity:.6;vector-effect:non-scaling-stroke}
.grat{stroke:var(--ink-3);stroke-opacity:.35;stroke-dasharray:2 4;vector-effect:non-scaling-stroke;stroke-width:1}
.latl{fill:var(--ink-3);font-family:var(--f-data)}
.mk{cursor:pointer}
.mk circle.b{stroke:var(--land);vector-effect:non-scaling-stroke;stroke-width:2}
.mk circle.ring{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}
.mk.saved circle.ring{stroke:var(--accent)}
.mk.done circle.ring{stroke:var(--ok)}
.mk.sel circle.halo{fill:var(--accent);fill-opacity:.2}
.mk.dim{opacity:.18}
.mk text{fill:var(--ink);font-family:var(--f-body);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mlabel{fill:var(--ink-2);font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.ctrl{position:absolute;right:max(14px,calc(env(safe-area-inset-right,0px) + 14px));top:14px;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;font-size:18px;font-weight:600}
.ctrl button svg{width:18px;height:18px}
.regions{position:absolute;left:14px;top:14px;right:70px;display:flex;flex-wrap:wrap;gap:6px}
.regions .chip{box-shadow:var(--shadow);background:var(--panel)}
.legend{position:absolute;left:14px;bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 14px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;font-size:12px}
.legend .row{gap:12px}
.legend .k{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.ringk{width:11px;height:11px;border-radius:50%;border:2px solid;display:inline-block}
.scale{font-family:var(--f-data);font-size:10.5px;color:var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12.5px;padding:5px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));box-shadow:var(--shadow)}
.tip small{opacity:.7;font-family:var(--f-data);font-size:11px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 24px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);z-index:20;transition:opacity .2s}
@media (max-width:820px){
  .app{grid-template-columns:100%;grid-template-rows:minmax(0,46%) minmax(0,54%)}
  .mapwrap{grid-row:1}
  .side{grid-row:2;border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;margin-top:-12px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .brand{padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand h1{font-size:22px}.brand small{display:none}.brand .mark{width:28px;height:28px}
  .pane{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
  .tabs{padding-inline:max(8px,env(safe-area-inset-left,0px))}
  .tab{font-size:13.5px;letter-spacing:.03em}
  .legend{display:none}
  .regions{left:max(10px,env(safe-area-inset-left,0px));top:10px;right:60px}
  .regions .chip{padding:3px 9px;font-size:12px}
  .ctrl{top:10px;right:max(10px,env(safe-area-inset-right,0px))}
  .ctrl button{width:34px;height:34px}
  .dh h2{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--accent)"/><path d="M6 30 L15 15 L20 22 L25 12 L34 30 Z" fill="var(--accent-ink)" opacity=".95"/><path d="M22.6 16.2 L25 12 L27.4 16.2 Z" fill="var(--accent)"/></svg>
      <div><h1>Senderos Argentinos</h1><small id="sub"></small></div>
      <button class="who" id="who" hidden title="Ver mi perfil"><img id="whoImg" alt=""><span id="whoName"></span></button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="explorar" aria-selected="true">Explorar</button>
      <button class="tab" role="tab" data-tab="mios" aria-selected="false">Progreso<span class="n" id="nMios"></span></button>
      <button class="tab" role="tab" data-tab="desafios" aria-selected="false">Desafíos</button>
      <button class="tab" role="tab" data-tab="ranking" aria-selected="false">Ranking</button>
    </nav>
    <div class="pane" id="pane"></div>
  </aside>
  <main class="mapwrap" id="mapwrap">
    <svg id="map" aria-label="Mapa de Argentina con senderos de trekking">
      <defs>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--land-edge)" stroke-opacity=".25" stroke-width="1"/></pattern>
      </defs>
      <g id="vp"></g>
    </svg>
    <div class="regions" id="regions"></div>
    <div class="ctrl">
      <button id="zin" aria-label="Acercar">+</button>
      <button id="zout" aria-label="Alejar">−</button>
      <button id="zfit" aria-label="Ver todo el país"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="legend" aria-label="Referencias">
      <div class="row"><span class="k"><span class="dot" style="background:var(--d1)"></span>Fácil</span><span class="k"><span class="dot" style="background:var(--d2)"></span>Moderada</span><span class="k"><span class="dot" style="background:var(--d3)"></span>Difícil</span><span class="k"><span class="dot" style="background:var(--d4)"></span>Experto</span></div>
      <div class="row"><span class="k"><span class="ringk" style="border-color:var(--accent)"></span>Guardado</span><span class="k"><span class="ringk" style="border-color:var(--ok)"></span>Hecho</span><span class="scale" id="scale"></span></div>
    </div>
    <div class="tip" id="tip" hidden></div>
  </main>
</div>

let S = {hechos:{}, guardados:{}};

let store = {mode:"local", db:null, user:null, uid:null, ranking:[]};

function lsGet(){try{const v=localStorage.getItem("senderos.estado");return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem("senderos.estado",JSON.stringify(S))}catch(e){}}
const loaded = lsGet(); if(loaded) S = {hechos:loaded.hechos||{}, guardados:loaded.guardados||{}};

let saveTimer=null, saving=false, dirty=false;
function persist(){
  lsSet();
  if(store.mode!=="db") return;
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,500);
}
async function flush(){
  if(saving||!dirty) return; saving=true; dirty=false;
  try{
    await store.db.doc("data/users/"+store.uid+"/estado").set({hechos:S.hechos, guardados:S.guardados, v:1});
    const st=stats();
    await store.db.doc("ranking/"+store.uid).set({xp:st.xp, hechos:st.n, km:st.km, prov:st.provs.size});
  }catch(e){
    if(e&&e.code==="invalid_argument"){store.mode="local"; render(); toast("No pudimos guardar en tu cuenta. Tu progreso queda en este navegador.");}
    else if(e&&e.code==="unavailable"){dirty=true; setTimeout(flush,1500+Math.random()*1000);}
    else if(e&&e.code==="quota_exceeded"){toast("Se llenó el espacio de guardado de la app.");}
  }finally{saving=false; if(dirty) flush();}
}

function stats(){
  const done = Object.keys(S.hechos).map(id=>byId[id]).filter(Boolean);
  const provs = new Set(done.map(t=>t.prov));
  const xp = done.reduce((a,t)=>a+xpOf(t),0);
  return {done, n:done.length, km:done.reduce((a,t)=>a+t.km,0), des:done.reduce((a,t)=>a+t.des,0), provs, xp,
    regs:r=>done.filter(t=>t.reg===r).length, multi:done.filter(t=>t.dias>1).length,
    max:done.filter(t=>t.dif===4).length, tdf:done.filter(t=>t.prov==="Tierra del Fuego").length,
    chalten:done.filter(t=>t.area.includes("Chaltén")).length};
}
function level(xp){let i=0;for(let j=0;j<LEVELS.length;j++) if(xp>=LEVELS[j][0]) i=j;
  const cur=LEVELS[i][0], nxt=LEVELS[i+1]?LEVELS[i+1][0]:null;
  return {i:i+1,name:LEVELS[i][1],cur,nxt,pct:nxt?(xp-cur)/(nxt-cur):1}}

function apply(){

  const k=V.k, vs0=viewSize(), u=1/(k*vs0.s), showLabels=k*vs0.s>=2.6;

(async()=>{
  if(!window.claude||!window.claude.use) return;
  const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
  store.user=user;
  if(user){const me=await user.me();store.name=me.name||"";store.avatar=me.avatarUrl;store.uid=me.id;
    const w=document.getElementById("who");document.getElementById("whoImg").src=me.avatarUrl;document.getElementById("whoName").textContent=me.name||"Mi perfil";w.hidden=false}
  if(!db||!store.uid){render();return}
  store.db=db;
  try{
    const snap=await db.doc("data/users/"+store.uid+"/estado").get();
    store.mode="db";
    if(snap.exists){const d=snap.data();
      // unir con lo que hubiera en este navegador
      S={hechos:{...S.hechos,...(d.hechos||{})},guardados:{...S.guardados,...(d.guardados||{})}};
      const localOnly=loaded&&(Object.keys(loaded.hechos||{}).some(k=>!(d.hechos||{})[k])||Object.keys(loaded.guardados||{}).some(k=>!(d.guardados||{})[k]));
      lsSet(); if(localOnly) persist();
    }else if(Object.keys(S.hechos).length||Object.keys(S.guardados).length){persist()}
  }catch(e){store.mode="local"}
  if(store.mode==="db"){
    db.collection("ranking").onSnapshot(q=>{store.ranking=q.docs.map(d=>({id:d.id,...d.data()}));if(ui.tab==="ranking"&&!ui.sel)render()},()=>{});
  }
  render();
})();
</script>
